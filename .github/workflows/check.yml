# Lints the app and the extension, runs the app's tests and model-checks the download queue on every push and pull request.
name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    # Downy is a Windows app, and the tests check the internet mark Windows puts on downloads.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      # The tests never start Electron, so its 100 MB download is skipped.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  workflows:
    # GitHub only reports a broken workflow file as a failed run with no log.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the workflow files
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  model:
    # TLC checks the TLA+ model of the download queue in formal/ and replays the bugs it guards against.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/cache@v5
        with:
          path: ~/.cache/downy-tla
          key: tla2tools-${{ hashFiles('formal/check.sh') }}

      - name: Model-check the download queue
        run: bash formal/check.sh
