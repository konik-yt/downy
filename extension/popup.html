<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --bg: #05050f; --ink: #f1f0ff; --muted: #a6a3c0; --line: #ffffff14; --brand: #8a7fe8; --bad: #ff9ebf; --track: #1d1a4a; }
  body { margin: 0; width: 320px; background: var(--bg); color: var(--ink); font: 13px/1.4 "Segoe UI", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .logo { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(150deg, #b4aaff, #7f78e6); color: #0a0920; display: grid; place-items: center; font-weight: 700; font-size: 12px; }
  h1 { font-size: 14px; margin: 0; font-weight: 600; }
  #status { margin-left: auto; font-size: 12px; color: var(--muted); }
  #status.ok::before, #status.bad::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; }
  #status.ok::before { background: var(--brand); }
  #status.bad { color: var(--bad); }
  #status.bad::before { background: var(--bad); }
  ul { list-style: none; margin: 0; padding: 4px 0; max-height: 300px; overflow: auto; }
  li { padding: 8px 14px; }
  .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .m { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .track { height: 4px; border-radius: 2px; background: var(--track); margin-top: 5px; overflow: hidden; }
  .fill { height: 100%; background: linear-gradient(90deg, #6f6cf0, #a99fff); }
  .note { padding: 14px; color: var(--muted); }
  .note.bad { color: var(--bad); }
  footer { padding: 10px 14px 12px; border-top: 1px solid var(--line); }
  button { width: 100%; font: inherit; font-weight: 600; padding: 8px; border-radius: 10px; border: 0; color: #f1f0ff; cursor: pointer;
    background: linear-gradient(90deg, #8a7fe880, #6f8cff33), #0d0b26; box-shadow: inset 0 -8px 14px -10px #a99fffcc, inset 0 1px 0 #ffffff14; }
  button:hover { filter: brightness(1.2); }
  .catch { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; cursor: pointer; }
  .catch small { display: block; color: var(--muted); font-size: 12px; }
  .catch input { width: 16px; height: 16px; accent-color: #8a7fe8; flex: none; }
</style>
</head>
<body>
<header><div class="logo">D</div><h1>Downy</h1><span id="status">Checking</span></header>
<ul id="list"></ul>
<footer>
  <label class="catch"><span>Catch Chrome downloads<small>Files of 1 MB or more go to Downy, into its Downloads folder</small></span><input type="checkbox" id="catch"></label>
  <button id="manager">Open Downy</button>
</footer>
<script src="popup.js"></script>
</body>
</html>
