<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --bg: #fff; --ink: #1b1f1c; --muted: #66706a; --line: #e6e8e4; --brand: #059669; --bad: #b42318; --track: #e8ebe6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1a1e1b; --ink: #e8ece9; --muted: #9aa59e; --line: #2f3531; --brand: #10b981; --bad: #ff8a7a; --track: #2f3531; }
  }
  body { margin: 0; width: 320px; background: var(--bg); color: var(--ink); font: 13px/1.4 "Segoe UI", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .logo { width: 22px; height: 22px; border-radius: 6px; background: #059669; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; }
  h1 { font-size: 14px; margin: 0; font-weight: 600; }
  #status { margin-left: auto; font-size: 12px; color: var(--muted); }
  #status.ok::before, #status.bad::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; }
  #status.ok::before { background: var(--brand); }
  #status.bad { color: var(--bad); }
  #status.bad::before { background: var(--bad); }
  ul { list-style: none; margin: 0; padding: 4px 0; max-height: 300px; overflow: auto; }
  li { padding: 8px 14px; }
  .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .m { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .track { height: 4px; border-radius: 2px; background: var(--track); margin-top: 5px; overflow: hidden; }
  .fill { height: 100%; background: var(--brand); }
  .note { padding: 14px; color: var(--muted); }
  .note.bad { color: var(--bad); }
  footer { padding: 10px 14px 12px; border-top: 1px solid var(--line); }
  button { width: 100%; font: inherit; font-weight: 600; padding: 7px; border-radius: 7px; border: 0; background: #059669; color: #fff; cursor: pointer; }
  button:hover { background: #07a674; }
</style>
</head>
<body>
<header><div class="logo">D</div><h1>Downy</h1><span id="status">Checking</span></header>
<ul id="list"></ul>
<footer><button id="manager">Open download manager</button></footer>
<script src="popup.js"></script>
</body>
</html>
