\* run() calls cleanup() when a download fails. TLC must report FailedKeepsPart.
SPECIFICATION Spec

CONSTANTS
    Jobs = {j1, j2, j3}
    BatchIds = {b1, b2, b3}
    NoBatch = NoBatch
    MaxActive = 1
    BUG_NO_STOPPING_GUARD = FALSE
    BUG_NO_ACTIVE_LIMIT = FALSE
    BUG_NO_BUSY_CHECK = FALSE
    BUG_KEEP_COOKIE = FALSE
    BUG_REMOVE_SKIPS_FINISHED = FALSE
    BUG_CLEANUP_ON_ERROR = TRUE
    BUG_REMOVE_RUNNING = FALSE
    BUG_NO_SCHEDULE_ON_RESUME = FALSE

SYMMETRY Symmetry

INVARIANT FailedKeepsPart
